apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rating-postgres
  template:
    metadata:
      labels:
        app: rating-postgres
    spec:
      containers:
        - name: rating-postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: rating_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: rating-postgres
spec:
  selector:
    app: rating-postgres
  ports:
    - port: 5432
      targetPort: 5432