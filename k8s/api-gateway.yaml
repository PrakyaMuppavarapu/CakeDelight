apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: cakedelight-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8080
            - name: ORDER_SERVICE_URL
              value: http://order-service:8081
            - name: RATING_SERVICE_URL
              value: http://rating-service:8082
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084